name: main_action
on: [push, pull_request]
jobs:
  cpplint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - run: pip install cpplint
    - run: cpplint --linelength=120 --extensions=hpp,cpp,h,c,ino --recursive .
  arduino_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/arduino-lint-action@v3
        with:
          library-manager: 'update'
  build_eep_esp8266:
    needs: [cpplint, arduino_lint]
    uses: ./.github/workflows/build_eep.yml
    with:
      core: esp8266
      board: d1_mini
  build_eep_esp32:
    needs: [cpplint, arduino_lint]
    uses: ./.github/workflows/build_eep.yml
    with:
      core: esp32
      board: esp32
  build_eep_esp32c3:
    needs: [cpplint, arduino_lint]
    uses: ./.github/workflows/build_eep.yml
    with:
      core: esp32
      board: esp32c3
      fqbn-ext: "CDCOnBoot=cdc"
  build_eep_esp32c5:
    needs: [cpplint, arduino_lint]
    uses: ./.github/workflows/build_eep.yml
    with:
      core: esp32
      board: esp32c5
      fqbn-ext: "CDCOnBoot=cdc"
  build_eep_esp32c6:
    needs: [cpplint, arduino_lint]
    uses: ./.github/workflows/build_eep.yml
    with:
      core: esp32
      board: esp32c6
      fqbn-ext: "CDCOnBoot=cdc"
  build_eep_esp32h2:
    needs: [cpplint, arduino_lint]
    uses: ./.github/workflows/build_eep.yml
    with:
      core: esp32
      board: esp32h2
      fqbn-ext: "CDCOnBoot=cdc"
  build_eep_esp32p4:
    needs: [cpplint, arduino_lint]
    uses: ./.github/workflows/build_eep.yml
    with:
      core: esp32
      board: esp32p4
      fqbn-ext: "CDCOnBoot=cdc"
  build_eep_esp32s2:
    needs: [cpplint, arduino_lint]
    uses: ./.github/workflows/build_eep.yml
    with:
      core: esp32
      board: esp32s2
      fqbn-ext: "CDCOnBoot=cdc"
  build_eep_esp32s3:
    needs: [cpplint, arduino_lint]
    uses: ./.github/workflows/build_eep.yml
    with:
      core: esp32
      board: esp32s3
      fqbn-ext: "CDCOnBoot=cdc"
  build_eef_packages:
    runs-on: ubuntu-latest
    needs: [build_eep_esp32s3, build_eep_esp32s2, build_eep_esp32p4, build_eep_esp32h2, build_eep_esp32c6, build_eep_esp32c5, build_eep_esp32c3, build_eep_esp32, build_eep_esp8266]
    env:
        TARGET: all
    steps:
      - uses: hredan/eef-carefree-action@v1.0.0
        with:
          target-os: ${{env.TARGET}}